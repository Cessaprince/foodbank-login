<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="parent">

        <div class="child left">
            <img src="https://foodbank-login.vercel.app/logo-foodbank.png" alt="">
        </div>

        <div class="child right">
            <p>Welcome Back</p>
            <form action="" id="form">
                <div class="input">
                    <label for="email" class="label">Email</label>
                    <input type="email" id="email" placeholder="e.g. samuel@soverigntechltd.com" class="input-space">
                </div>
                <div class="input">
                    <label for="password" class="label">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" class="input-space">
                </div>

                <div class="check">
                    <input type="checkbox" name="check" id="check">
                    <span class="label">Keep me logged in</span>
                </div>

                <button type="submit" class="button" id="login-button">Login</button>
            </form>

        </div>

    </div>

    <script src="/script.js"></script>
</body>

</html>
