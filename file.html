<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="file.css">
    <title>Document</title>
</head>
<body>
    <div class="parent">

        <div class="child left">
            <img src="logo-foodbank.png" alt="">
        </div>

        <div class="child right">
            <p>Welcome Back</p>
            <div class="input">
                <label for="email" class="label">Email</label>
                <input type="email" placeholder="e.g. samuel@soverigntechltd.com" class="input-space" required>
            </div>
            <div class="input">
                <label for="password" class="label">Password</label>
                <input type="password" placeholder="Enter your password" class="input-space" required>
            </div>

            <div class="check">
                <input type="checkbox" name="check" id="check">
                <span class="label">Keep me logged in</span>
            </div>

            <button type="submit" class="button">Login</button>

        </div>

    </div>
</body>
</html>
